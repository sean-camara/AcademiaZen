<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademiaZen | AI-Powered Study Suite for Students</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="AcademiaZen is an AI-powered productivity suite for students. Manage tasks, generate quizzes, track focus sessions, and master your knowledge with Zen Intelligence." />
    <link rel="canonical" href="https://academiazen.app/" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://academiazen.app/" />
    <meta property="og:title" content="AcademiaZen | AI-Powered Study Suite for Students" />
    <meta property="og:description" content="Master your knowledge with AI-generated quizzes, focus timers, flashcards, and intelligent study tools. Built for the modern student." />
    <meta property="og:image" content="https://academiazen.app/icons/academiazen-mark.svg" />
    <meta property="og:site_name" content="AcademiaZen" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AcademiaZen | AI-Powered Study Suite" />
    <meta name="twitter:description" content="Master your knowledge with AI-generated quizzes, focus timers, flashcards, and intelligent study tools." />
    <meta name="twitter:image" content="https://academiazen.app/icons/academiazen-mark.svg" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#64FFDA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZEN" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ZEN" />
    <meta name="msapplication-TileColor" content="#0B0F14" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/academiazen-mark.svg" />
    <link rel="shortcut icon" href="/icons/academiazen-mark.svg" />
    <link rel="apple-touch-icon" href="/icons/academiazen-mark.svg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Initialize PDF.js worker
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Tesseract.js for OCR (scanned PDFs) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
      body {
        background-color: #0B0F14;
        color: #E6E6E6;
        -webkit-tap-highlight-color: transparent;
      }
      /* Hide scrollbar for cleaner UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Staggered animation helpers */
      .stagger-1 { animation-delay: 0.05s; }
      .stagger-2 { animation-delay: 0.1s; }
      .stagger-3 { animation-delay: 0.15s; }
      .stagger-4 { animation-delay: 0.2s; }
      .stagger-5 { animation-delay: 0.25s; }
      
      .animate-reveal {
        animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      
      .perspective-1000 {
        perspective: 1000px;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* PDF Canvas specific styles */
      #pdf-canvas {
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        max-width: 100%;
        height: auto !important;
      }
    </style>

</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
