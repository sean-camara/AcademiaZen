<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AcademiaZen brand mark</title>
  <desc id="desc">An open book beneath a calm orbit, representing learning and focus.</desc>
  <defs>
    <linearGradient id="surface" x1="72" y1="48" x2="438" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172536"/>
      <stop offset="1" stop-color="#0B1019"/>
    </linearGradient>
    <linearGradient id="accent" x1="118" y1="134" x2="394" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64FFDA"/>
      <stop offset="1" stop-color="#8F75FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(256 250) rotate(90) scale(220)">
      <stop stop-color="#64FFDA" stop-opacity=".14"/>
      <stop offset="1" stop-color="#64FFDA" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="132" fill="url(#surface)"/>
  <rect x="21" y="21" width="470" height="470" rx="131" fill="url(#glow)" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2"/>

  <path d="M367 154a151 151 0 1 0 37 166" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" opacity=".9"/>
  <circle cx="379" cy="139" r="22" fill="#8F75FF" filter="url(#softGlow)"/>

  <path d="M108 218c49-19 100-7 148 33v145c-45-35-94-47-148-28V218Z" fill="#64FFDA" fill-opacity=".09" stroke="#64FFDA" stroke-width="17" stroke-linejoin="round"/>
  <path d="M404 218c-49-19-100-7-148 33v145c45-35 94-47 148-28V218Z" fill="#8F75FF" fill-opacity=".09" stroke="#8F75FF" stroke-width="17" stroke-linejoin="round"/>
  <path d="M256 251v145" stroke="#E8FFF9" stroke-width="13" stroke-linecap="round" opacity=".9"/>
  <path d="M143 258c31-7 57 0 78 17M369 258c-31-7-57 0-78 17" fill="none" stroke="#E8FFF9" stroke-opacity=".42" stroke-width="10" stroke-linecap="round"/>
</svg>
