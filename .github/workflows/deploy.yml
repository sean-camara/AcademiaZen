name: Build & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.academiazen.app
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Upload built files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: "${{ secrets.VPS_APP_PATH }}/frontend-new"
          strip_components: 1

      - name: Activate Deployment & Update Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            
            # Atomic swap for frontend (no build on server!)
            rm -rf "$APP_PATH/frontend-old"
            mv "$APP_PATH/AcademiaZen/dist" "$APP_PATH/frontend-old" 2>/dev/null || true
            mv "$APP_PATH/frontend-new" "$APP_PATH/AcademiaZen/dist"
            
            # Pull latest code (for reference, no rebuild)
            cd "$APP_PATH/AcademiaZen"
            git pull --ff-only || true
            
            # Update backend (lightweight - just pull and restart PM2)
            cd "$APP_PATH/AcademiaZen_Backend"
            git pull --ff-only
            npm install --production --silent
            pm2 restart academiazen-backend --update-env || pm2 start server.js --name academiazen-backend
            
            # Reload nginx
            sudo systemctl reload nginx
            
            echo "✅ Deployment complete!"

